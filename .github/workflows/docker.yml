 with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}

      platforms: linux/amd64,linux/arm64

      context: ./root_v6.30.08
      file: ./root_v6.30.08/Dockerfile

      cache: true
      cache-scope: root-v6-30-08

      meta-images: ${{ vars.DOCKERHUB_USERNAME }}/nuisancemc
      meta-tags: |
        type=raw,value=root_v6.30.08

    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}